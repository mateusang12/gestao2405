<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Oficina - Agendamento</title>
    <link rel="stylesheet" href="css/site.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Oficina Msa</div>
        <nav>
            <a href="home.html" class="nav-link">Home</a>
            <button id="btnAbrirLogin" class="btn-login">Login Admin</button>
        </nav>
    </header>

    <div class="page-wrapper">

        <aside class="side-banner left-banner">
            <img src="https://dealersites-content.s3.us-east-1.amazonaws.com/dealersites/vehicles/models/byd/foto_model_890_1243.webp" alt="Carro Byd de perfil vertical">

        </aside>

        <main class="form-container">
            <h2>Agendamento de Serviços Mecânicos</h2>
            <form id="formOficina">

                <div class="form-group">
                    <label for="nomeCliente">Nome Completo</label>
                    <input type="text" id="nomeCliente" required placeholder="Digite seu nome">
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone / WhatsApp</label>
                    <input type="tel" id="telefone" required placeholder="(00) 00000-0000">
                </div>

                <div class="form-group">
                    <label for="selectMarca">Marca do Veículo</label>
                    <select id="selectMarca" required>
                        <option value="">Selecione a Marca</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="selectModelo">Modelo do Veículo</label>
                    <select id="selectModelo" required disabled>
                        <option value="">Selecione o Modelo</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="selectServico">Serviço Necessário</label>
                    <select id="selectServico" required>
                        <option value="">Selecione o Serviço (Top 10 mais procurados)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="dataAgendamento">Data e Horário do Agendamento</label>
                    <input type="datetime-local" id="dataAgendamento" required>
                    <small id="erroData" class="erro-msg hidden"></small>
                </div>

                <button type="submit" class="btn-enviar">Solicitar Agendamento</button>
            </form>
            <div id="mensagemSucesso" class="hidden"></div>
        </main>

        <aside class="side-banner right-banner">
            <img src="https://www.ford.ca/acslibs/content/dam/na/ford/en_ca/images/bronco/2026/jellybeans/26_frd_bro_base_2d_ps34_sblk_v2.png" alt="Carro Ford vertical">


        </aside>

    </div>
    <div id="modalLogin" class="modal hidden">
        <div class="modal-content">
            <span id="btnFecharLogin" class="close-btn">&times;</span>
            <h3>Acesso Administrativo</h3>
            <form id="formLogin">
                <div class="form-group">
                    <label for="usuario">Usuário</label>
                    <input type="text" id="usuario" required placeholder="Digite o usuário">
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required placeholder="Digite a senha">
                </div>
                <button type="submit" class="btn-enviar">Entrar</button>
                <p id="erroLogin" class="erro-msg hidden">Usuário ou senha inválidos.</p>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
